[package]
name = "geozip-core"
description = "GeoZip GZ1: AES-256 ZIP archives whose key is derived from places and words"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "parallel"] }
base64 = "0.23"
getrandom = "0.4"
libm = "0.2"
thiserror = "2"
time = "0.3"
unicode-normalization = "0.1"
zeroize = "1"
zip = { version = "9.6", default-features = false, features = [
    "aes-crypto",
    "deflate-flate2-zlib-rs",
    "deflate64",
    "time",
] }

[dev-dependencies]
tempfile = "3"
