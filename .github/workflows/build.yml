name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

env:
  AWS_LC_SYS_PREBUILT_NASM: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: GeoZip-linux-x86_64.tar.gz
          - os: windows-latest
            asset: GeoZip-windows-x86_64.zip
          - os: macos-latest
            asset: GeoZip-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the word list
        if: runner.os == 'Linux'
        run: python3 tools/check_wordlist.py
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir GeoZip
          cp target/release/geozip-gui target/release/geozip LICENSE README.md GeoZip/
          tar -czf ${{ matrix.asset }} GeoZip
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir GeoZip
          cp target/release/geozip-gui.exe target/release/geozip.exe LICENSE README.md GeoZip/
          7z a ${{ matrix.asset }} GeoZip
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          app=GeoZip/GeoZip.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" icon.iconset
          cp target/release/geozip-gui "$app/Contents/MacOS/GeoZip"
          sed "s/VERSION/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          for size in 16 32 128 256; do
            sips -z $size $size assets/icon.png --out icon.iconset/icon_${size}x${size}.png
          done
          sips -z 32 32 assets/icon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 64 64 assets/icon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 256 256 assets/icon.png --out icon.iconset/icon_128x128@2x.png
          iconutil -c icns icon.iconset -o "$app/Contents/Resources/GeoZip.icns"
          codesign --force --deep --sign - "$app"
          cp target/release/geozip LICENSE README.md GeoZip/
          ditto -c -k --keepParent GeoZip ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          gh release create "${{ github.ref_name }}" * \
            --repo "${{ github.repository }}" \
            --title "GeoZip ${{ github.ref_name }}" \
            --notes "Experimental release. See the README for what works and what does not."
